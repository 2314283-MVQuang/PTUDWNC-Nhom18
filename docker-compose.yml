# =============================================================================
#  Culinary Blog — Docker Compose cho môi trường phát triển
#
#  Cách dùng thường gặp:
#
#    docker compose up -d postgres       # chỉ dựng database (đủ cho backend .NET chạy)
#    docker compose up -d postgres adminer   # thêm giao diện web xem/sửa dữ liệu
#    docker compose up -d seq            # Seq — web UI log tập trung (Tuần 3, FR-OBS-002)
#    docker compose up --build api       # chạy backend .NET trong container
#    docker compose up --build frontend  # chạy frontend bằng Docker
#    docker compose down                 # dừng tất cả, GIỮ LẠI dữ liệu
#    docker compose down -v              # dừng và XOÁ SẠCH dữ liệu database
#
#  Các service khác trong tài liệu đặc tả (minio, nginx, mailhog — mục 6.4) sẽ thêm sau khi
#  backend cần đến. Redis đã thêm ở Tuần 4 cho Output Cache (mâu thuẫn #3).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — database chính (mục 6.1)
  #
  # Lần đầu khởi động, PostgreSQL tự chạy mọi file .sql trong /docker-entrypoint-initdb.d
  # theo thứ tự tên file: 01-extensions → 02-schema → 03-seed.
  #
  # LƯU Ý: các file đó CHỈ chạy khi volume dữ liệu còn trống. Sửa file .sql rồi
  # `docker compose up` lại sẽ KHÔNG có tác dụng — phải `docker compose down -v`
  # để xoá volume rồi dựng lại.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: culinaryblog-postgres
    environment:
      POSTGRES_DB: culinaryblog
      POSTGRES_USER: culinary
      POSTGRES_PASSWORD: culinary123
      # Bắt buộc so khớp mật khẩu khi kết nối (mặc định của image alpine là trust).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Backend nên đợi healthcheck này xanh rồi mới kết nối.
      test: ["CMD-SHELL", "pg_isready -U culinary -d culinaryblog"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Adminer — giao diện web để xem/sửa dữ liệu, không phải cài phần mềm gì thêm.
  # Mở http://localhost:8080 rồi đăng nhập:
  #     System   : PostgreSQL
  #     Server   : postgres
  #     Username : culinary
  #     Password : culinary123
  #     Database : culinaryblog
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: culinaryblog-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seq — web UI xem structured log tập trung (FR-OBS-002, Tuần 3). Backend ghi log qua sink
  # Serilog.Sinks.Seq (xem appsettings.json section "Serilog") gửi tới cổng ingestion 5341 —
  # cổng này giữ nguyên số để chạy `dotnet run` NGOÀI Docker (không qua service "api" dưới đây)
  # cũng gửi log vào Seq được luôn, không cần đổi appsettings.
  # Mở http://localhost:8081 để xem log (KHÔNG dùng cổng 5341 cho web UI — cổng đó chỉ nhận log).
  # Không cần dữ liệu Seq sống sót qua lần dựng lại (không đáng cho phạm vi Lab) nên không khai
  # báo volume — `docker compose down` là mất sạch log cũ, chấp nhận được.
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: culinaryblog-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "8081:80"
      - "5341:5341"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 7 — Output Cache (Tuần 4, mâu thuẫn #3: bỏ IMemoryCache, chỉ 1 tầng cache duy nhất).
  # Không cần dữ liệu cache sống sót qua lần dựng lại (TTL ngắn nhất 1 phút, dài nhất 30 phút —
  # mất cache chỉ gây vài request đầu chậm hơn, không mất dữ liệu thật) nên có khai volume để giữ
  # qua restart bình thường, nhưng `docker compose down -v` xoá sạch cũng không sao.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: culinaryblog-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend .NET — CulinaryBlog.API
  #
  #     docker compose up --build api
  #
  # Dùng khi không chạy được `dotnet run` trên Windows, ví dụ bị Smart App Control
  # chặn file .dll tự build (lỗi 0x800711C7) — trong container Linux thì chính sách
  # đó không áp dụng. Sửa code C# xong phải thêm cờ --build để dựng lại image.
  # ---------------------------------------------------------------------------
  api:
    build:
      # Context PHẢI là gốc repo vì Dockerfile cần cả 4 project trong src/.
      context: .
      dockerfile: src/CulinaryBlog.API/Dockerfile
    container_name: culinaryblog-api
    # Mở ra cổng 5000 để giữ nguyên http://localhost:5000 y như lúc chạy dotnet run,
    # nhờ vậy frontend và Scalar UI không phải sửa gì.
    ports:
      - "5000:8080"
    environment:
      # Development để bật Scalar UI tại /scalar (xem Program.cs).
      ASPNETCORE_ENVIRONMENT: Development
      # Trong container, "localhost" trỏ về chính container này chứ không phải máy
      # thật, nên phải gọi PostgreSQL bằng tên service là "postgres".
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=culinaryblog;Username=culinary;Password=culinary123"
      # Trong container, "localhost" trỏ về chính container này chứ không phải máy thật, nên phải
      # gọi Redis bằng tên service "redis" (giống lý do ConnectionStrings__DefaultConnection ở trên).
      Redis__ConnectionString: "redis:6379,abortConnect=false"
      # Jwt:Secret bình thường nằm trong User Secrets của máy dev, mà User Secrets
      # KHÔNG được copy vào image — không truyền vào đây thì API chết lúc đăng nhập.
      # Giá trị mặc định dưới đây CHỈ để chạy thử trên máy cá nhân; deploy thật thì
      # đặt biến môi trường JWT_SECRET bằng khoá ngẫu nhiên từ 32 ký tự trở lên.
      Jwt__Secret: ${JWT_SECRET:-local-dev-only-hay-doi-khoa-nay-truoc-khi-deploy}
    volumes:
      # Giữ lại ảnh đã upload sau mỗi lần dựng lại image. LocalFileStorageService ghi
      # vào "wwwroot/uploads", trong container là /app/wwwroot/uploads.
      - uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Next.js (tuỳ chọn — nếu không muốn cài Node.js trên máy)
  #
  # Chạy ở chế độ PRODUCTION (next build + next start) nên KHÔNG có hot-reload;
  # sửa code xong phải `docker compose up --build frontend` lại. Đang code thì
  # dùng `npm run dev` trong thư mục frontend/ sẽ tiện hơn nhiều.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Biến NEXT_PUBLIC_* phải có mặt LÚC BUILD vì Next.js nhúng thẳng vào
        # bundle gửi xuống trình duyệt. Backend đổi cổng thì sửa đây rồi build lại.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api/v1
    container_name: culinaryblog-frontend
    ports:
      - "3000:3000"
    environment:
      # Khoá ký cookie phiên đăng nhập của Auth.js. Giá trị dưới đây CHỈ để chạy
      # thử trên máy cá nhân. Trước khi deploy thật, sinh khoá mới bằng
      # `npx auth secret` rồi đặt vào biến môi trường AUTH_SECRET của máy chủ.
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-only-hay-doi-khoa-nay-truoc-khi-deploy}
      NEXTAUTH_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
